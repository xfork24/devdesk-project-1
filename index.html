<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎来到这里</title>
  <style>
    .language-controls {
      display: flex;
      justify-content: flex-end;
      padding: 8px;
    }
    #language-toggle {
      min-height: 44px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }
    #language-toggle:focus-visible {
      outline: 3px solid #005fcc;
      outline-offset: 3px;
    }
    #gallery { width: min(100%, 720px); margin: 24px 0; }
    .gallery-slot { height: 360px; }
    #gallery-trigger { display: block; box-sizing: border-box; width: 100%; height: 360px; padding: 0; border: 0; background: #14202b; cursor: zoom-in; }
    #gallery-image { display: block; width: 100%; height: 100%; object-fit: contain; }
    #gallery-image[hidden] { display: none; }
    #gallery-trigger:focus-visible, .gallery-controls button:focus-visible { outline: 3px solid #005fcc; outline-offset: 3px; }
    #gallery.expanded #gallery-trigger { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1000; cursor: zoom-out; background: #080d12; }
    #gallery.expanded .gallery-controls { visibility: hidden; }
    .gallery-controls { display: flex; gap: 12px; margin-top: 12px; }
    .gallery-controls button { min-height: 44px; padding: 8px 20px; font: inherit; cursor: pointer; }
    #gallery-status { min-height: 1.5em; }
  </style>
</head>
<body>
  <div class="language-controls">
    <button id="language-toggle" type="button" title="切换到英文" lang="en">English</button>
  </div>
  <main>
    <h1>欢迎来到这里</h1>
    <section id="gallery" aria-label="自然风景图片窗">
      <div class="gallery-slot">
        <button id="gallery-trigger" type="button" aria-label="放大图片，再次点击还原" aria-expanded="false">
          <img id="gallery-image" alt="" hidden>
        </button>
      </div>
      <div class="gallery-controls">
        <button id="gallery-prev" type="button">上一张</button>
        <button id="gallery-next" type="button">下一张</button>
      </div>
      <p id="gallery-status" role="status" aria-live="polite">正在加载图片…</p>
      <p><span id="gallery-credit">图片来自 </span><a href="https://www.pexels.com/zh-cn/">Pexels</a><span id="gallery-help"> · 点击图片放大或还原</span></p>
    </section>
  </main>
  <script>
    (() => {
      const button = document.getElementById('language-toggle');
      if (!button) return;

      let language = 'zh';
      const messages = {
        zh: {
          welcome: '欢迎来到这里', gallery: '自然风景图片窗', prev: '上一张', next: '下一张',
          credit: '图片来自 ', help: ' · 点击图片放大或还原',
          expand: '放大图片，再次点击还原', restore: '还原图片',
          loading: '正在加载第 {number} / 5 张图片…', ready: '第 {number} / 5 张 · {author}',
          error: '第 {number} / 5 张加载失败，请切换图片后重试。',
          alts: ['湖水倒映着群山和树林', '行人走在绿色森林的小径中', '云雾环绕的雪山', '白雪覆盖的山峰', '暮光中的层叠山峦']
        },
        en: {
          welcome: 'Welcome here', gallery: 'Nature photo gallery', prev: 'Previous', next: 'Next',
          credit: 'Photos from ', help: ' · Click the image to enlarge or restore',
          expand: 'Enlarge image; click again to restore', restore: 'Restore image',
          loading: 'Loading image {number} / 5…', ready: 'Image {number} / 5 · {author}',
          error: 'Image {number} / 5 failed to load. Switch images to retry.',
          alts: ['A lake reflecting mountains and trees', 'A person walking along a green forest path', 'Snowy mountains surrounded by clouds', 'Snow-covered mountain peaks', 'Layered mountains at twilight']
        }
      };
      const t = (key, params = {}) => messages[language][key].replace(/\{(\w+)\}/g, (_, name) => params[name]);
      let renderGalleryText = () => {};
      function renderLanguage(nextLanguage) {
        language = nextLanguage;
        document.title = t('welcome');
        if (document.documentElement) document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        const heading = document.querySelector('h1');
        if (heading) heading.textContent = t('welcome');
        button.setAttribute('title', language === 'zh' ? '切换到英文' : 'Switch to Chinese (Simplified)');
        button.textContent = language === 'zh' ? 'English' : '中文';
        button.setAttribute('lang', language === 'zh' ? 'en' : 'zh');
        renderGalleryText();
      }
      renderLanguage(language);
      button.addEventListener('click', () => renderLanguage(language === 'zh' ? 'en' : 'zh'));
      const gallery = document.getElementById('gallery');
      const image = document.getElementById('gallery-image');
      const prev = document.getElementById('gallery-prev');
      const next = document.getElementById('gallery-next');
      const status = document.getElementById('gallery-status');
      if (!gallery || !image || !prev || !next || !status || !document.createElement) return;
      const trigger = image.closest('button');
      if (!trigger) return;
      const photos = [
        {
                "id": 417074,
                "src": "https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=1920",
                "sourcePage": "https://www.pexels.com/photo/lake-and-mountain-417074/",
                "author": "James Wheeler",
                "alt": "湖水倒映着群山和树林"
        },
        {
                "id": 15286,
                "src": "https://images.pexels.com/photos/15286/pexels-photo.jpg?auto=compress&cs=tinysrgb&w=1920",
                "sourcePage": "https://www.pexels.com/photo/person-walking-between-green-forest-trees-15286/",
                "author": "Luis del Río",
                "alt": "行人走在绿色森林的小径中"
        },
        {
                "id": 691668,
                "src": "https://images.pexels.com/photos/691668/pexels-photo-691668.jpeg?auto=compress&cs=tinysrgb&w=1920",
                "sourcePage": "https://www.pexels.com/photo/landscape-photography-of-mountains-covered-in-snow-691668/",
                "author": "eberhard grossgasteiger",
                "alt": "云雾环绕的雪山"
        },
        {
                "id": 1366919,
                "src": "https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg?auto=compress&cs=tinysrgb&w=1920",
                "sourcePage": "https://www.pexels.com/photo/landscape-photography-of-snowy-mountain-1366919/",
                "author": "eberhard grossgasteiger",
                "alt": "白雪覆盖的山峰"
        },
        {
                "id": 1261728,
                "src": "https://images.pexels.com/photos/1261728/pexels-photo-1261728.jpeg?auto=compress&cs=tinysrgb&w=1920",
                "sourcePage": "https://www.pexels.com/photo/scenic-view-of-mountains-during-dawn-1261728/",
                "author": "Stephan Seeber",
                "alt": "暮光中的层叠山峦"
        }
];
      let index = 0, expanded = false, request = 0, phase = 'loading';
      renderGalleryText = () => {
        gallery.setAttribute('aria-label', t('gallery'));
        prev.textContent = t('prev');
        next.textContent = t('next');
        for (const [id, key] of [['gallery-credit', 'credit'], ['gallery-help', 'help']]) {
          const node = document.getElementById(id);
          if (node) node.textContent = t(key);
        }
        image.alt = messages[language].alts[index];
        trigger.setAttribute('aria-label', t(expanded ? 'restore' : 'expand'));
        status.textContent = t(phase, {number: index + 1, author: photos[index].author});
      };
      let savedFocus, savedScroll, savedOverflow;
      function show() {
        const photo = photos[index];
        const token = ++request;
        image.hidden = true;
        phase = 'loading';
        image.src = photo.src;
        renderGalleryText();
        // A separate Image owns each request, so a stale event cannot complete a newer one.
        const pending = new Image();
        pending.onload = () => {
          if (token !== request) return;
          image.hidden = false;
          phase = 'ready';
          renderGalleryText();
        };
        pending.onerror = () => {
          if (token !== request) return;
          setExpanded(false);
          image.hidden = true;
          phase = 'error';
          renderGalleryText();
        };
        pending.src = photo.src;
      }
      function step(delta) {
        if (expanded) return;
        index = (index + delta + photos.length) % photos.length;
        show();
      }
      function setExpanded(value) {
        if (value === expanded) return;
        expanded = value;
        if (expanded) {
          savedFocus = document.activeElement;
          savedScroll = {left: window.scrollX, top: window.scrollY};
          savedOverflow = document.body.style.overflow;
          document.body.style.overflow = 'hidden';
        }
        gallery.classList.toggle('expanded', expanded);
        trigger.setAttribute('aria-expanded', String(expanded));
        renderGalleryText();
        if (!expanded) {
          document.body.style.overflow = savedOverflow;
          if (savedFocus && savedFocus.focus) savedFocus.focus({preventScroll: true});
          window.scrollTo(savedScroll);
        }
      }
      prev.addEventListener('click', () => step(-1));
      next.addEventListener('click', () => step(1));
      trigger.addEventListener('click', () => setExpanded(!expanded));
      trigger.addEventListener('keydown', event => {
        if (event.key === 'Escape') setExpanded(false);
        if (expanded && event.key === 'Tab') { event.preventDefault(); trigger.focus(); }
      });
      show();
    })();
  </script>
</body>
</html>
