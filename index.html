<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎来到这里</title>
  <style>
    .language-controls {
      display: flex;
      justify-content: flex-end;
      padding: 8px;
    }
    #language-toggle {
      min-height: 44px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }
    #language-toggle:focus-visible {
      outline: 3px solid #005fcc;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="language-controls">
    <button id="language-toggle" type="button" title="切换为英语" lang="en" aria-describedby="language-hint">English</button>
  </div>
  <main>
    <h1>欢迎来到这里</h1>
    <p id="welcome-message" lang="zh" aria-live="polite">欢迎</p>
    <p id="language-hint" lang="zh">语言切换支持键盘操作</p>
  </main>
  <script>
    (() => {
      const welcome = document.getElementById('welcome-message');
      const button = document.getElementById('language-toggle');
      const hint = document.getElementById('language-hint');
      if (!welcome || !button) return;

      let language = 'zh';
      function renderLanguage(nextLanguage) {
        language = nextLanguage;
        button.setAttribute('title', language === 'zh' ? '切换为英语' : 'Switch to Simplified Chinese');
        welcome.textContent = language === 'zh' ? '欢迎' : 'Welcome';
        welcome.setAttribute('lang', language);
        button.textContent = language === 'zh' ? 'English' : '中文';
        button.setAttribute('lang', language === 'zh' ? 'en' : 'zh');
        if (hint) {
          hint.textContent = language === 'zh' ? '语言切换支持键盘操作' : 'Language switching supports keyboard controls';
          hint.setAttribute('lang', language);
        }
      }

      renderLanguage(language);
      button.addEventListener('click', () => {
        renderLanguage(language === 'zh' ? 'en' : 'zh');
      });
    })();
  </script>
</body>
</html>
